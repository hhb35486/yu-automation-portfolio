<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Yu Automation Logo</title>
  <desc id="desc">A clean blue Y mark with subtle workflow nodes.</desc>
  <defs>
